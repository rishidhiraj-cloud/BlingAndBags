<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expenses - Bling & Bags</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="expense-style.css">
</head>
<body>
    <!-- Loader -->
    <div id="pageLoader" class="page-loader">
        <div class="loader-spinner"></div>
    </div>

    <div class="container">
        <header>
            <div class="header-content">
                <div class="burger-menu-container">
                    <div class="burger-icon" id="burgerIcon">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
                <div class="header-text">
                    <h1>Bling & Bags</h1>
                    <p class="subtitle">Expense Tracker</p>
                </div>
                <div class="header-logo-right">
                    <img src="Logo.png" alt="Shop Logo">
                </div>
            </div>
        </header>

        <div class="burger-overlay" id="burgerOverlay"></div>
        <div class="burger-menu" id="burgerMenu">
            <nav>
                <a href="entry.html" data-num="01">New Entry</a>
                <a href="history.html" data-num="02">History</a>
                <a href="expense.html" data-num="03">Expenses</a>
                <a href="statement.html" data-num="04">Statement</a>
                <button id="darkModeToggle" class="dark-mode-toggle-btn">🌙 Dark Mode</button>
            </nav>
        </div>

        <main>
            <div class="back-to-dashboard">
                <a href="index.html">« Back To Dashboard</a>
            </div>

            <!-- Month Indicator -->
            <div class="month-indicator"><span class="mi-label">Viewing Month:</span> <span id="currentMonthLabel" class="mi-value">Loading...</span></div>

            <!-- Expense Entry Form -->
            <div class="form-section">
                <h2>Add Expense</h2>
                <form id="expenseForm">
                    <!-- Expense Date -->
                    <div class="form-group">
                        <label for="expenseDate">Expense Date</label>
                        <input type="date"
                               id="expenseDate"
                               name="expenseDate"
                               required>
                    </div>

                    <!-- Expense By -->
                    <div class="form-group">
                        <label for="expenseBy">Expense By</label>
                        <select id="expenseBy"
                                name="expenseBy"
                                required>
                            <option value="">Select Person</option>
                            <option value="Dhiraj">Dhiraj</option>
                            <option value="Pallavi">Pallavi</option>
                        </select>
                    </div>

                    <!-- Amount -->
                    <div class="form-group">
                        <label for="amount">Amount</label>
                        <input type="number"
                               id="amount"
                               name="amount"
                               placeholder="0.00"
                               step="0.01"
                               min="0"
                               inputmode="decimal"
                               required>
                    </div>

                    <!-- Paid From -->
                    <div class="form-group">
                        <label>Paid From</label>
                        <div class="paid-from-group">
                            <label class="paid-from-item">
                                <input type="checkbox" id="paidFromBank" name="paidFrom" value="Bank">
                                Bank
                            </label>
                            <label class="paid-from-item">
                                <input type="checkbox" id="paidFromSavingCash" name="paidFrom" value="Saving Cash">
                                Saving Cash
                            </label>
                            <label class="paid-from-item">
                                <input type="checkbox" id="paidFromSelf" name="paidFrom" value="Self">
                                Self
                            </label>
                        </div>
                    </div>

                    <!-- Description -->
                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description"
                                  name="description"
                                  rows="3"
                                  placeholder="Enter expense details..."></textarea>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn-primary" id="submitBtn">
                        Save Expense
                    </button>
                </form>

                <!-- Status Message -->
                <div id="statusMessage" class="status-message"></div>
            </div>

            <!-- Expense History -->
            <div class="history-section">
                <div class="history-header">
                    <h2>Expense History</h2>
                    <span class="total-expense" id="totalExpense">₹0.00</span>
                </div>

                <!-- Filter -->
                <div class="form-group">
                    <label for="filterExpenseBy">Filter by Expense By</label>
                    <select id="filterExpenseBy" name="filterExpenseBy">
                        <option value="">All</option>
                        <option value="Dhiraj">Dhiraj</option>
                        <option value="Pallavi">Pallavi</option>
                    </select>
                </div>

                <div id="expenseHistory" class="expense-list">
                    <div class="loading-spinner">Loading expenses...</div>
                </div>
            </div>
        </main>
    </div>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <script src="expense.js?v=1"></script>
    <!-- Vercel Speed Insights -->
    <script>
        window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
